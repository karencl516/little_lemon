{% extends 'base.html' %}
{% load static %}

{% block content %}
<section>
  <article>
    <h1>Make a reservation</h1>
    <!--Begin row-->
    <div class="row">
      <!--Begin col-->
      <div class="column">
          {% csrf_token %}
          <form method="POST" id="form">
            <!-- {% csrf_token %} -->
            <p>
              <label for="first_name">Name:</label>
              <input type="text" placeholder="Your Name" maxlength="200" required="" id="first_name">
            </p>
            <p>
              <label for="reservation_date">Date:</label>
              <input type="date" placeholder="Reservation Date" maxlength="200" required="" id="reservation_date">
            </p>
      
            <p>
              <label for="persons">Number of people:</label>
              <input type="number" min="1" placeholder="Number of people" required="" id="persons">
            </p>
            <button type="button" id="button">Reserve</button>
            <p id="login-hint" hidden>Log in to reserve a table. <a href="{% url 'web_login' %}">Login</a></p>
          </form>
      </div>
      <!--End col-->

      <!--Begin col-->
      <div class="column">
        <h2>Bookings For <span id="today"></span></h2>
        <div id="bookings">
        </div>
      </div>
      <!--End col-->
    </div>
    <!--End row-->




  </article>
</section>
<script>

  const date = new Date()
  document.getElementById('reservation_date').value = `${date.getFullYear()}-${(date.getMonth() + 1).toString().padStart(2, "0")}-${date.getDate().toString().padStart(2, "0")}`

  console.log(document.getElementById('reservation_date').value)
  getBookings()

  document.getElementById('reservation_date').addEventListener('change', 
  function() {
    getBookings()
  })

  function getBookings() {
    const date = document.getElementById('reservation_date').value
    document.getElementById('today').innerHTML = date

    fetch("{% url 'bookings' %}" + '?date=' + date)
      .then(r => r.json())
      .then(data => {
        let bookings = ''

        for(const item of data ){
          bookings += `<p>${item.fields.name} - ${item.fields.persons} people</p>`
        }

        if(bookings==''){
          bookings = "No bookings"
        }
        document.getElementById('bookings').innerHTML = bookings
      })
  }


  document.getElementById('button').addEventListener('click', function (e) {
    const formdata = {
      name: document.getElementById('first_name').value,
      persons: document.getElementById('persons').value,
      reservation_date: document.getElementById('reservation_date').value,
    }

    const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value

    fetch("{% url 'bookings' %}", {
      method: 'post',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrftoken },
      body: JSON.stringify(formdata),
    })
      .then(r => {
        if (r.status === 401 || r.status === 403) {
          document.getElementById('login-hint').hidden = false
          return
        }
        getBookings()
      })
  })
</script>
{% endblock %}
